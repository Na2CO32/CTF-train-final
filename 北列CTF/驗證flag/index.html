<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTF Flag 驗證平台</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            bg: '#0b0f19',
                            card: '#111827',
                            border: '#1f2937',
                            primary: '#06b6d4',
                            success: '#10b981',
                            danger: '#ef4444'
                        }
                    }
                }
            }
        }
    </script>

    <!-- Font Awesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Canvas Confetti for Celebration Effect -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

    <!-- Custom CSS Styles -->
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19;
            background-image: 
                radial-gradient(at 0% 0%, rgba(6, 182, 212, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.08) 0px, transparent 50%);
            background-attachment: fixed;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col justify-between selection:bg-cyan-500 selection:text-black">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-950/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="p-2 bg-cyan-500/10 border border-cyan-500/30 rounded-xl text-cyan-400">
                    <i class="fa-solid fa-shield-halved text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-slate-100 tracking-wide flex items-center gap-2">
                        CTF FLAG 驗證系統
                        <span class="text-xs bg-cyan-500/20 text-cyan-400 border border-cyan-500/30 px-2 py-0.5 rounded-full font-mono">v1.0</span>
                    </h1>
                    <p class="text-xs text-slate-400">純前端 純文字字串比對</p>
                </div>
            </div>
            
            <button onclick="resetProgress()" class="text-xs text-slate-400 hover:text-rose-400 transition-colors flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-slate-800 hover:border-rose-500/30 hover:bg-rose-500/10">
                <i class="fa-solid fa-rotate-right"></i>
                <span>重置進度</span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-8 w-full flex-grow flex flex-col gap-8">
        
        <!-- Input & Submission Card -->
        <section class="bg-cyber-card border border-slate-800 rounded-2xl p-6 shadow-2xl relative overflow-hidden">
            <div class="space-y-4">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                    <label for="flagInput" class="text-sm font-semibold text-slate-300 flex items-center gap-2">
                        <i class="fa-solid fa-terminal text-cyan-400"></i>
                        請輸入 FLAG
                    </label>
                    <span class="text-xs text-slate-500 font-mono">格式: Fhcst{...}</span>
                </div>

                <div class="flex flex-col sm:flex-row gap-3">
                    <input 
                        type="text" 
                        id="flagInput" 
                        placeholder="Fhcst{your_flag_here}" 
                        class="flex-grow bg-slate-950 border border-slate-800 focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 text-slate-100 placeholder-slate-600 rounded-xl px-4 py-3 font-mono text-sm outline-none transition-all"
                        onkeydown="if(event.key === 'Enter') submitFlag()"
                    />
                    <button 
                        onclick="submitFlag()" 
                        class="bg-cyan-600 hover:bg-cyan-500 active:bg-cyan-700 text-slate-950 font-bold px-6 py-3 rounded-xl transition-all duration-200 flex items-center justify-center gap-2 shadow-lg shadow-cyan-500/20 whitespace-nowrap"
                    >
                        <i class="fa-solid fa-key"></i>
                        <span>驗證 FLAG</span>
                    </button>
                </div>

                <!-- Message Feedback Box -->
                <div id="alertBox" class="hidden rounded-xl p-3 text-sm flex items-start gap-2.5 transition-all">
                    <i id="alertIcon" class="fa-solid text-base mt-0.5"></i>
                    <span id="alertMsg"></span>
                </div>
            </div>
        </section>

        <!-- Progress and Target Cards Grid -->
        <section class="space-y-4">
            <div class="flex items-center justify-between">
                <h3 class="text-sm font-semibold text-slate-400 tracking-wider uppercase flex items-center gap-2">
                    <i class="fa-solid fa-bullseye text-cyan-400"></i>
                    目標檢核點 (無序認證)
                </h3>
                <div id="progressText" class="text-xs font-mono font-semibold text-slate-400">
                    完成度: <span id="solvedCount" class="text-cyan-400">0</span> / 3
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <!-- Target Slot 1 -->
                <div id="card-0" class="group bg-cyber-card/70 border border-slate-800 rounded-2xl p-5 transition-all duration-300 relative overflow-hidden flex flex-col justify-between">
                    <div class="space-y-3">
                        <div class="flex justify-between items-center">
                            <span class="text-xs px-2.5 py-1 rounded-md bg-slate-800/80 text-slate-400 font-mono font-semibold border border-slate-700/50">
                                TARGET 01
                            </span>
                            <span id="badge-0" class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-slate-800 text-slate-400 border border-slate-700">
                                ❓ 未解開
                            </span>
                        </div>
                        <h4 class="text-base font-bold text-slate-200 group-hover:text-cyan-400 transition-colors">
                            Flag Slot 1
                        </h4>
                    </div>

                    <div class="mt-6 pt-4 border-t border-slate-800/60 flex items-center justify-between text-xs">
                        <span id="status-text-0" class="text-slate-500 flex items-center gap-1.5">
                            <i class="fa-solid fa-lock text-slate-600"></i> 等待驗證
                        </span>
                        <i id="status-icon-0" class="fa-solid fa-circle-question text-slate-600 text-base"></i>
                    </div>
                </div>

                <!-- Target Slot 2 -->
                <div id="card-1" class="group bg-cyber-card/70 border border-slate-800 rounded-2xl p-5 transition-all duration-300 relative overflow-hidden flex flex-col justify-between">
                    <div class="space-y-3">
                        <div class="flex justify-between items-center">
                            <span class="text-xs px-2.5 py-1 rounded-md bg-slate-800/80 text-slate-400 font-mono font-semibold border border-slate-700/50">
                                TARGET 02
                            </span>
                            <span id="badge-1" class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-slate-800 text-slate-400 border border-slate-700">
                                ❓ 未解開
                            </span>
                        </div>
                        <h4 class="text-base font-bold text-slate-200 group-hover:text-cyan-400 transition-colors">
                            Flag Slot 2
                        </h4>
                    </div>

                    <div class="mt-6 pt-4 border-t border-slate-800/60 flex items-center justify-between text-xs">
                        <span id="status-text-1" class="text-slate-500 flex items-center gap-1.5">
                            <i class="fa-solid fa-lock text-slate-600"></i> 等待驗證
                        </span>
                        <i id="status-icon-1" class="fa-solid fa-circle-question text-slate-600 text-base"></i>
                    </div>
                </div>

                <!-- Target Slot 3 -->
                <div id="card-2" class="group bg-cyber-card/70 border border-slate-800 rounded-2xl p-5 transition-all duration-300 relative overflow-hidden flex flex-col justify-between">
                    <div class="space-y-3">
                        <div class="flex justify-between items-center">
                            <span class="text-xs px-2.5 py-1 rounded-md bg-slate-800/80 text-slate-400 font-mono font-semibold border border-slate-700/50">
                                TARGET 03
                            </span>
                            <span id="badge-2" class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-slate-800 text-slate-400 border border-slate-700">
                                ❓ 未解開
                            </span>
                        </div>
                        <h4 class="text-base font-bold text-slate-200 group-hover:text-cyan-400 transition-colors">
                            Flag Slot 3
                        </h4>
                    </div>

                    <div class="mt-6 pt-4 border-t border-slate-800/60 flex items-center justify-between text-xs">
                        <span id="status-text-2" class="text-slate-500 flex items-center gap-1.5">
                            <i class="fa-solid fa-lock text-slate-600"></i> 等待驗證
                        </span>
                        <i id="status-icon-2" class="fa-solid fa-circle-question text-slate-600 text-base"></i>
                    </div>
                </div>
            </div>
        </section>

        <!-- Congratulations Section (Hidden by default) -->
        <section id="congratsBox" class="hidden bg-emerald-950/30 border border-emerald-500/40 rounded-2xl p-6 text-center space-y-3 shadow-xl shadow-emerald-900/10">
            <div class="inline-flex items-center justify-center p-3 bg-emerald-500/10 rounded-full text-emerald-400 text-3xl mb-1">
                <i class="fa-solid fa-trophy"></i>
            </div>
            <h3 class="text-xl font-bold text-emerald-400">恭喜！全部 FLAG 解鎖成功！</h3>
            <p class="text-sm text-slate-300">您已成功通過三個關卡的 FLAG 驗證！</p>
        </section>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800/60 py-4 text-center text-xs text-slate-500">
        CTF Flag Verification System &bull; Plain Text Matching
    </footer>

    <!-- JavaScript Verification Logic -->
    <script>
        /* 
         * 正確的 3 個 FLAG 純文字陣列
         */
        const TARGET_FLAGS = [
            "Fhcst{How_important_is_robots.txt}",
            "Fhcst{This_is_Caesar_cipher}",
            "Fhcst{網頁程式碼內的秘密}"
        ];

        // 紀錄關卡解鎖狀態
        let unlockedState = [false, false, false];

        // 頁面載入時初始化
        window.addEventListener('load', () => {
            loadSavedState();
            updateUI();
        });

        // 處理 FLAG 提交驗證（純文字比對）
        function submitFlag() {
            const inputElement = document.getElementById('flagInput');
            const userFlag = inputElement.value.trim();

            if (!userFlag) {
                showAlert('請輸入 FLAG 內容！', 'warning');
                return;
            }

            // 直接使用 indexOf 進行純文字對比
            const matchIndex = TARGET_FLAGS.indexOf(userFlag);

            if (matchIndex !== -1) {
                if (unlockedState[matchIndex]) {
                    showAlert('這個 FLAG 之前已經解開過了喔！', 'info');
                } else {
                    unlockedState[matchIndex] = true;
                    saveState();
                    updateUI();
                    showAlert(`成功解開 Target 0${matchIndex + 1}！`, 'success');
                    
                    // 觸發彩帶特效
                    confetti({
                        particleCount: 80,
                        spread: 60,
                        origin: { y: 0.7 }
                    });

                    // 清空輸入框
                    inputElement.value = '';
                }
            } else {
                showAlert('FLAG 錯誤，請再試試看！', 'error');
            }
        }

        // 顯示提示訊息
        function showAlert(msg, type) {
            const alertBox = document.getElementById('alertBox');
            const alertMsg = document.getElementById('alertMsg');
            const alertIcon = document.getElementById('alertIcon');

            alertBox.className = 'rounded-xl p-3 text-sm flex items-start gap-2.5 transition-all ';
            
            if (type === 'success') {
                alertBox.classList.add('bg-emerald-500/10', 'border', 'border-emerald-500/30', 'text-emerald-400');
                alertIcon.className = 'fa-solid fa-circle-check text-emerald-400';
            } else if (type === 'error') {
                alertBox.classList.add('bg-rose-500/10', 'border', 'border-rose-500/30', 'text-rose-400');
                alertIcon.className = 'fa-solid fa-circle-xmark text-rose-400';
            } else if (type === 'info') {
                alertBox.classList.add('bg-cyan-500/10', 'border', 'border-cyan-500/30', 'text-cyan-400');
                alertIcon.className = 'fa-solid fa-circle-info text-cyan-400';
            } else if (type === 'warning') {
                alertBox.classList.add('bg-amber-500/10', 'border', 'border-amber-500/30', 'text-amber-400');
                alertIcon.className = 'fa-solid fa-triangle-exclamation text-amber-400';
            }

            alertMsg.textContent = msg;
            alertBox.classList.remove('hidden');
        }

        // 更新介面卡片與狀態
        function updateUI() {
            let solvedTotal = 0;

            unlockedState.forEach((isUnlocked, idx) => {
                const card = document.getElementById(`card-${idx}`);
                const badge = document.getElementById(`badge-${idx}`);
                const statusText = document.getElementById(`status-text-${idx}`);
                const statusIcon = document.getElementById(`status-icon-${idx}`);

                if (isUnlocked) {
                    solvedTotal++;
                    
                    // 解鎖後的卡片樣式
                    card.className = "group bg-emerald-950/20 border border-emerald-500/40 rounded-2xl p-5 transition-all duration-300 relative overflow-hidden flex flex-col justify-between shadow-lg shadow-emerald-950/30";
                    
                    // 標籤樣式
                    badge.className = "text-xs font-semibold px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/40";
                    badge.innerHTML = "✓ 已解開";

                    // 狀態文字與圖示
                    statusText.className = "text-emerald-400 flex items-center gap-1.5 font-medium";
                    statusText.innerHTML = '<i class="fa-solid fa-lock-open text-emerald-400"></i> 驗證通過';

                    statusIcon.className = "fa-solid fa-circle-check text-emerald-400 text-base";
                } else {
                    // 未解鎖卡片樣式
                    card.className = "group bg-cyber-card/70 border border-slate-800 rounded-2xl p-5 transition-all duration-300 relative overflow-hidden flex flex-col justify-between";
                    
                    // 標籤樣式
                    badge.className = "text-xs font-semibold px-2.5 py-0.5 rounded-full bg-slate-800 text-slate-400 border border-slate-700";
                    badge.innerHTML = "❓ 未解開";

                    // 狀態文字與圖示
                    statusText.className = "text-slate-500 flex items-center gap-1.5";
                    statusText.innerHTML = '<i class="fa-solid fa-lock text-slate-600"></i> 等待驗證';

                    statusIcon.className = "fa-solid fa-circle-question text-slate-600 text-base";
                }
            });

            // 更新完成數量
            document.getElementById('solvedCount').textContent = solvedTotal;

            // 全部解開時顯示通關區塊
            const congratsBox = document.getElementById('congratsBox');
            if (solvedTotal === 3) {
                congratsBox.classList.remove('hidden');
            } else {
                congratsBox.classList.add('hidden');
            }
        }

        // 保存進度到 localStorage
        function saveState() {
            localStorage.setItem('ctf_flags_unlocked_state_plain', JSON.stringify(unlockedState));
        }

        // 讀取 localStorage 進度
        function loadSavedState() {
            const saved = localStorage.getItem('ctf_flags_unlocked_state_plain');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (Array.isArray(parsed) && parsed.length === 3) {
                        unlockedState = parsed;
                    }
                } catch(e) {
                    console.error("Failed to load state", e);
                }
            }
        }

        // 重置進度
        function resetProgress() {
            unlockedState = [false, false, false];
            localStorage.removeItem('ctf_flags_unlocked_state_plain');
            updateUI();
            
            const alertBox = document.getElementById('alertBox');
            alertBox.classList.add('hidden');
            document.getElementById('flagInput').value = '';
        }
    </script>
</body>
</html>
