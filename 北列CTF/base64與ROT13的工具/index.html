<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base64 與 ROT13 / 凱撒密碼加解密工具</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0284c7',
                            700: '#0369a1',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
        }
        .dark ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-200 flex flex-col">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Header Navigation -->
    <header class="border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-primary-600 text-white rounded-xl shadow-md shadow-primary-500/20">
                    <i data-lucide="shield-check" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight text-slate-900 dark:text-white">編碼與加解密線上工具</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400 hidden sm:block">極速、安全、純前端處理的文字編碼與加密密碼學工具</p>
                </div>
            </div>

            <!-- Controls (Theme Toggle) -->
            <div class="flex items-center gap-2">
                <button id="theme-toggle" class="p-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 transition-colors focus:outline-none focus:ring-2 focus:ring-primary-500" title="切換深淺色模式">
                    <i id="theme-icon-sun" data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
                    <i id="theme-icon-moon" data-lucide="moon" class="w-5 h-5 block dark:hidden"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col gap-6">

        <!-- Navigation Tabs -->
        <div class="flex border-b border-slate-200 dark:border-slate-800 space-x-1 sm:space-x-4">
            <button id="tab-btn-base64" onclick="switchTab('base64')" class="tab-btn flex items-center gap-2 py-3 px-4 font-medium text-sm rounded-t-lg border-b-2 border-primary-600 text-primary-600 dark:text-primary-400 transition-all">
                <i data-lucide="binary" class="w-4 h-4"></i>
                <span>Base64 編解碼</span>
            </button>
            <button id="tab-btn-rot13" onclick="switchTab('rot13')" class="tab-btn flex items-center gap-2 py-3 px-4 font-medium text-sm rounded-t-lg border-b-2 border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-300 transition-all">
                <i data-lucide="key-round" class="w-4 h-4"></i>
                <span>ROT13 / 凱撒密碼</span>
            </button>
        </div>

        <!-- Tab 1: Base64 Tool -->
        <section id="tab-content-base64" class="tab-content space-y-6">
            <!-- Top Controls Toolbar -->
            <div class="bg-white dark:bg-slate-800/50 p-4 rounded-2xl border border-slate-200 dark:border-slate-700/60 shadow-sm flex flex-wrap items-center justify-between gap-4">
                <div class="flex items-center gap-4 flex-wrap">
                    <span class="text-sm font-semibold text-slate-700 dark:text-slate-200">操作模式：</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="base64-auto-convert" checked class="sr-only peer">
                        <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:after:border-slate-600 peer-checked:bg-primary-600"></div>
                        <span class="ml-2 text-sm font-medium text-slate-600 dark:text-slate-300">即時轉換 (Auto)</span>
                    </label>
                </div>

                <!-- Manual trigger buttons when auto-convert is off -->
                <div id="base64-manual-btns" class="flex gap-2 w-full sm:w-auto">
                    <button onclick="handleBase64Action('encode')" class="flex-1 sm:flex-none px-4 py-2 bg-primary-600 hover:bg-primary-700 text-white rounded-xl font-medium text-sm transition-colors shadow-sm flex items-center justify-center gap-1.5">
                        <i data-lucide="arrow-right-left" class="w-4 h-4"></i> 編碼
                    </button>
                    <button onclick="handleBase64Action('decode')" class="flex-1 sm:flex-none px-4 py-2 bg-slate-700 hover:bg-slate-800 text-white rounded-xl font-medium text-sm transition-colors shadow-sm flex items-center justify-center gap-1.5">
                        <i data-lucide="file-code" class="w-4 h-4"></i> 解碼
                    </button>
                </div>
            </div>

            <!-- Main Input/Output Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Input Box -->
                <div class="flex flex-col bg-white dark:bg-slate-800/50 rounded-2xl border border-slate-200 dark:border-slate-700/60 shadow-sm overflow-hidden">
                    <div class="px-4 py-3 bg-slate-100/70 dark:bg-slate-800/80 border-b border-slate-200 dark:border-slate-700/60 flex justify-between items-center">
                        <label for="base64-input" class="font-semibold text-sm text-slate-700 dark:text-slate-200 flex items-center gap-2">
                            <i data-lucide="file-input" class="w-4 h-4 text-primary-500"></i> 輸入文字或檔案
                        </label>
                        <div class="flex items-center gap-1">
                            <button onclick="pasteFromClipboard('base64-input')" class="px-2.5 py-1 text-xs text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-lg transition-colors flex items-center gap-1" title="貼上剪貼簿內容">
                                <i data-lucide="clipboard-paste" class="w-3.5 h-3.5"></i> 貼上
                            </button>
                            <button onclick="clearText('base64-input', 'base64-output')" class="px-2.5 py-1 text-xs text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30 rounded-lg transition-colors flex items-center gap-1" title="清除內容">
                                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> 清除
                            </button>
                        </div>
                    </div>
                    <textarea id="base64-input" rows="8" placeholder="請在此輸入要處理的文字（完整支援 Unicode / 繁體中文 UTF-8）..." class="w-full p-4 bg-transparent border-0 focus:ring-0 text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 resize-none font-mono text-sm leading-relaxed"></textarea>
                    
                    <!-- File Upload Option Bar -->
                    <div class="p-3 bg-slate-50 dark:bg-slate-800/30 border-t border-slate-200 dark:border-slate-700/60 flex items-center justify-between text-xs">
                        <span class="text-slate-500 dark:text-slate-400">或將檔案轉為 Base64 Data URL：</span>
                        <label class="cursor-pointer bg-white dark:bg-slate-700 border border-slate-300 dark:border-slate-600 hover:bg-slate-50 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 px-3 py-1.5 rounded-lg font-medium transition-colors flex items-center gap-1.5 shadow-sm">
                            <i data-lucide="upload" class="w-3.5 h-3.5"></i> 選擇檔案
                            <input type="file" id="base64-file-input" onchange="handleFileUpload(event)" class="hidden">
                        </label>
                    </div>
                </div>

                <!-- Output Box -->
                <div class="flex flex-col bg-white dark:bg-slate-800/50 rounded-2xl border border-slate-200 dark:border-slate-700/60 shadow-sm overflow-hidden">
                    <div class="px-4 py-3 bg-slate-100/70 dark:bg-slate-800/80 border-b border-slate-200 dark:border-slate-700/60 flex justify-between items-center">
                        <label for="base64-output" class="font-semibold text-sm text-slate-700 dark:text-slate-200 flex items-center gap-2">
                            <i data-lucide="file-output" class="w-4 h-4 text-emerald-500"></i> 轉換結果
                        </label>
                        <button onclick="copyToClipboard('base64-output')" class="px-2.5 py-1 text-xs text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-lg transition-colors flex items-center gap-1" title="複製輸出內容">
                            <i data-lucide="copy" class="w-3.5 h-3.5"></i> 複製結果
                        </button>
                    </div>
                    <textarea id="base64-output" readonly rows="10" placeholder="轉換後的結果將在此顯示..." class="w-full p-4 bg-transparent border-0 focus:ring-0 text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 resize-none font-mono text-sm leading-relaxed"></textarea>
                </div>
            </div>
        </section>

        <!-- Tab 2: ROT13 / Caesar Cipher Tool -->
        <section id="tab-content-rot13" class="tab-content hidden space-y-6">
            <!-- Top Controls Toolbar -->
            <div class="bg-white dark:bg-slate-800/50 p-4 rounded-2xl border border-slate-200 dark:border-slate-700/60 shadow-sm flex flex-wrap items-center justify-between gap-4">
                <div class="flex items-center gap-6 flex-wrap">
                    <!-- Shift Step Controls -->
                    <div class="flex items-center gap-3">
                        <label for="rot-shift" class="text-sm font-semibold text-slate-700 dark:text-slate-200">位移位元數 (Shift):</label>
                        <div class="flex items-center">
                            <input type="number" id="rot-shift" min="0" max="25" value="13" class="w-16 px-2.5 py-1.5 text-center bg-slate-100 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg text-sm font-semibold focus:ring-2 focus:ring-primary-500 focus:outline-none">
                        </div>
                        <span id="rot-badge" class="text-xs bg-primary-100 dark:bg-primary-950/50 text-primary-700 dark:text-primary-300 px-2 py-1 rounded-md font-mono">標準 ROT13</span>
                    </div>

                    <div class="h-4 w-px bg-slate-200 dark:bg-slate-700 hidden sm:block"></div>

                    <!-- Auto Convert Toggle -->
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="rot-auto-convert" checked class="sr-only peer">
                        <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:after:border-slate-600 peer-checked:bg-primary-600"></div>
                        <span class="ml-2 text-sm font-medium text-slate-600 dark:text-slate-300">即時轉換 (Auto)</span>
                    </label>
                </div>

                <!-- Quick Presets -->
                <div class="flex items-center gap-2">
                    <button onclick="setRotShift(13)" class="px-3 py-1.5 text-xs bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 rounded-lg transition-colors font-medium">重置 13</button>
                </div>
            </div>

            <!-- Main Input/Output Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Input Box -->
                <div class="flex flex-col bg-white dark:bg-slate-800/50 rounded-2xl border border-slate-200 dark:border-slate-700/60 shadow-sm overflow-hidden">
                    <div class="px-4 py-3 bg-slate-100/70 dark:bg-slate-800/80 border-b border-slate-200 dark:border-slate-700/60 flex justify-between items-center">
                        <label for="rot-input" class="font-semibold text-sm text-slate-700 dark:text-slate-200 flex items-center gap-2">
                            <i data-lucide="type" class="w-4 h-4 text-primary-500"></i> 輸入英文字串
                        </label>
                        <div class="flex items-center gap-1">
                            <button onclick="pasteFromClipboard('rot-input')" class="px-2.5 py-1 text-xs text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-lg transition-colors flex items-center gap-1">
                                <i data-lucide="clipboard-paste" class="w-3.5 h-3.5"></i> 貼上
                            </button>
                            <button onclick="clearText('rot-input', 'rot-output')" class="px-2.5 py-1 text-xs text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30 rounded-lg transition-colors flex items-center gap-1">
                                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> 清除
                            </button>
                        </div>
                    </div>
                    <textarea id="rot-input" rows="10" placeholder="輸入包含英文字母的文字，如 Hello World!..." class="w-full p-4 bg-transparent border-0 focus:ring-0 text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 resize-none font-mono text-sm leading-relaxed"></textarea>
                </div>

                <!-- Output Box -->
                <div class="flex flex-col bg-white dark:bg-slate-800/50 rounded-2xl border border-slate-200 dark:border-slate-700/60 shadow-sm overflow-hidden">
                    <div class="px-4 py-3 bg-slate-100/70 dark:bg-slate-800/80 border-b border-slate-200 dark:border-slate-700/60 flex justify-between items-center">
                        <label for="rot-output" class="font-semibold text-sm text-slate-700 dark:text-slate-200 flex items-center gap-2">
                            <i data-lucide="lock" class="w-4 h-4 text-emerald-500"></i> 位移變換結果
                        </label>
                        <button onclick="copyToClipboard('rot-output')" class="px-2.5 py-1 text-xs text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-lg transition-colors flex items-center gap-1">
                            <i data-lucide="copy" class="w-3.5 h-3.5"></i> 複製結果
                        </button>
                    </div>
                    <textarea id="rot-output" readonly rows="10" placeholder="加密/解碼結果將在此顯示..." class="w-full p-4 bg-transparent border-0 focus:ring-0 text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 resize-none font-mono text-sm leading-relaxed"></textarea>
                </div>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-200 dark:border-slate-800 py-6 text-center text-xs text-slate-500 dark:text-slate-400">
        <p>100% 純前端網頁工具 — 所有運算均在您的本機瀏覽器內完成，資料絕不傳輸至伺服器。</p>
    </footer>

    <!-- Logic JavaScript -->
    <script>
        // Initialize Icons
        lucide.createIcons();

        // Theme Switcher Logic
        const themeToggleBtn = document.getElementById('theme-toggle');
        themeToggleBtn.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
        });

        // Tab Switching Logic
        function switchTab(tab) {
            const tabs = ['base64', 'rot13'];
            tabs.forEach(t => {
                const btn = document.getElementById(`tab-btn-${t}`);
                const content = document.getElementById(`tab-content-${t}`);
                if (t === tab) {
                    btn.classList.add('border-primary-600', 'text-primary-600', 'dark:text-primary-400');
                    btn.classList.remove('border-transparent', 'text-slate-500', 'dark:text-slate-400');
                    content.classList.remove('hidden');
                } else {
                    btn.classList.remove('border-primary-600', 'text-primary-600', 'dark:text-primary-400');
                    btn.classList.add('border-transparent', 'text-slate-500', 'dark:text-slate-400');
                    content.classList.add('hidden');
                }
            });
        }

        // Notification Toast Handler
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const bgClass = type === 'error' 
                ? 'bg-red-500 text-white' 
                : type === 'success' 
                ? 'bg-emerald-600 text-white' 
                : 'bg-slate-800 text-white dark:bg-slate-200 dark:text-slate-900';

            toast.className = `px-4 py-2.5 rounded-xl shadow-lg text-sm font-medium flex items-center gap-2 transform transition-all duration-300 translate-y-[-10px] opacity-0 pointer-events-auto ${bgClass}`;
            
            let iconName = 'info';
            if (type === 'error') iconName = 'alert-circle';
            if (type === 'success') iconName = 'check-circle-2';

            toast.innerHTML = `<i data-lucide="${iconName}" class="w-4 h-4"></i><span>${message}</span>`;
            
            container.appendChild(toast);
            lucide.createIcons({ targets: [toast] });

            // Animation
            setTimeout(() => {
                toast.classList.remove('translate-y-[-10px]', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-[-10px]');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Clipboard Helpers
        async function copyToClipboard(elementId) {
            const textarea = document.getElementById(elementId);
            if (!textarea.value) {
                showToast('沒有可複製的內容', 'error');
                return;
            }

            try {
                // Fallback for copy
                textarea.select();
                document.execCommand('copy');
                window.getSelection().removeAllRanges();
                showToast('已複製到剪貼簿！', 'success');
            } catch (err) {
                showToast('複製失敗，請手動複製', 'error');
            }
        }

        async function pasteFromClipboard(elementId) {
            try {
                const text = await navigator.clipboard.readText();
                const textarea = document.getElementById(elementId);
                textarea.value = text;
                textarea.dispatchEvent(new Event('input'));
                showToast('已貼上剪貼簿內容', 'success');
            } catch (err) {
                showToast('無法存取剪貼簿，請手動貼上', 'error');
            }
        }

        function clearText(inputId, outputId) {
            document.getElementById(inputId).value = '';
            document.getElementById(outputId).value = '';
            showToast('已清除內容');
        }

        /* ----------------------------------------------------
         * Base64 Encoding / Decoding Logic (Full UTF-8 Support)
         * ---------------------------------------------------- */
        
        // Encode UTF-8 string to Base64
        function utf8ToBase64(str) {
            const bytes = new TextEncoder().encode(str);
            let binary = '';
            for (let i = 0; i < bytes.byteLength; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return btoa(binary);
        }

        // Decode Base64 string to UTF-8
        function base64ToUtf8(str) {
            const binary = atob(str.trim());
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            return new TextDecoder().decode(bytes);
        }

        const base64Input = document.getElementById('base64-input');
        const base64Output = document.getElementById('base64-output');
        const base64AutoConvert = document.getElementById('base64-auto-convert');

        function processBase64() {
            const val = base64Input.value;
            if (!val) {
                base64Output.value = '';
                return;
            }

            // Auto conversion attempts encode by default unless input looks specifically like Base64
            try {
                base64Output.value = utf8ToBase64(val);
            } catch (e) {
                base64Output.value = '編碼出錯：' + e.message;
            }
        }

        function handleBase64Action(action) {
            const val = base64Input.value;
            if (!val) {
                showToast('請先輸入要處理的文字', 'error');
                return;
            }

            if (action === 'encode') {
                try {
                    base64Output.value = utf8ToBase64(val);
                    showToast('Base64 編碼成功', 'success');
                } catch (e) {
                    showToast('編碼失敗：' + e.message, 'error');
                }
            } else if (action === 'decode') {
                try {
                    base64Output.value = base64ToUtf8(val);
                    showToast('Base64 解碼成功', 'success');
                } catch (e) {
                    showToast('無效的 Base64 字串，解碼失敗', 'error');
                }
            }
        }

        base64Input.addEventListener('input', () => {
            if (base64AutoConvert.checked) {
                processBase64();
            }
        });

        // File to Base64 Data URL
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                base64Input.value = `[檔案已載入: ${file.name} (${(file.size/1024).toFixed(2)} KB)]`;
                base64Output.value = e.target.result;
                showToast('檔案已成功轉換為 Base64 Data URL！', 'success');
            };
            reader.onerror = function() {
                showToast('讀取檔案失敗', 'error');
            };
            reader.readAsDataURL(file);
        }


        /* ----------------------------------------------------
         * ROT13 / Caesar Cipher Logic
         * ---------------------------------------------------- */
        
        function caesarCipher(str, shift) {
            // Ensure shift is between 0 and 25
            shift = (shift % 26 + 26) % 26;
            
            return str.replace(/[a-zA-Z]/g, function(char) {
                const code = char.charCodeAt(0);
                // Uppercase A-Z (65-90)
                if (code >= 65 && code <= 90) {
                    return String.fromCharCode(((code - 65 + shift) % 26) + 65);
                }
                // Lowercase a-z (97-122)
                if (code >= 97 && code <= 122) {
                    return String.fromCharCode(((code - 97 + shift) % 26) + 97);
                }
                return char;
            });
        }

        const rotInput = document.getElementById('rot-input');
        const rotOutput = document.getElementById('rot-output');
        const rotShift = document.getElementById('rot-shift');
        const rotBadge = document.getElementById('rot-badge');
        const rotAutoConvert = document.getElementById('rot-auto-convert');

        function processRot() {
            const val = rotInput.value;
            const shift = parseInt(rotShift.value) || 0;
            rotOutput.value = caesarCipher(val, shift);
        }

        function setRotShift(value) {
            rotShift.value = value;
            updateRotBadge();
            processRot();
        }

        function updateRotBadge() {
            const shift = parseInt(rotShift.value) || 0;
            if (shift === 13) {
                rotBadge.innerText = '標準 ROT13';
            } else {
                rotBadge.innerText = `愷撒位移 +${shift}`;
            }
        }

        rotInput.addEventListener('input', () => {
            if (rotAutoConvert.checked) {
                processRot();
            }
        });

        rotShift.addEventListener('input', () => {
            updateRotBadge();
            if (rotAutoConvert.checked) {
                processRot();
            }
        });
    </script>
</body>
</html>
