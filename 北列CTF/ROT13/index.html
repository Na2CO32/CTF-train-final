<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTF 密碼學挑戰</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #1e293b;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            max-width: 600px;
            width: 100%;
            text-align: center;
            border: 1px solid #334155;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 20px;
            font-size: 1.8rem;
        }
        .hint-box {
            background-color: #0f172a;
            border-left: 4px solid #38bdf8;
            padding: 15px;
            margin-bottom: 25px;
            text-align: left;
            border-radius: 0 8px 8px 0;
        }
        .hint-title {
            font-weight: bold;
            color: #94a3b8;
            margin-bottom: 5px;
            font-size: 0.9rem;
            text-transform: uppercase;
        }
        .hint-content {
            color: #e2e8f0;
            font-size: 1.05rem;
            line-height: 1.5;
        }
        .cipher-box {
            background-color: #020617;
            padding: 20px;
            border-radius: 8px;
            border: 1px dashed #475569;
            margin-bottom: 25px;
        }
        .cipher-title {
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 8px;
        }
        .cipher-text {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.2rem;
            color: #4ade80;
            word-break: break-all;
            user-select: all;
        }
        footer {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>密碼學挑戰 (Cryptography)</h1>

        <div class="hint-box">
            <div class="hint-title">提示 (Hint)</div>
            <div class="hint-content">
                凱薩曾用這種方式與其他將軍聯絡
            </div>
        </div>

        <div class="cipher-box">
            <div class="cipher-title">密文 (Encrypted Flag)</div>
            <div class="cipher-text">
                Acxno{Ocdn_dn_Xvznvm_xdkczm}
            </div>
        </div>

        <footer>
            CTF Challenge &copy; 2026
        </footer>
    </div>

</body>
</html>
