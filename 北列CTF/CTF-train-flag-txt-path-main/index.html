<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第一章・遺失的禮物</title>
    <style>
        * { box-sizing: border-box; }

        body {
            /* 深金黃色背景，類似深色琥珀或古銅 */
            background-color: #2a251a;
            color: #d4af37; /* 金屬質感金色 */
            font-family: 'Georgia', 'Noto Serif TC', serif; /* 使用襯線字體增添質感 */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px 16px;
        }

        main {
            width: min(680px, 100%);
        }

        .chapter {
            font-size: 0.95em;
            letter-spacing: 4px;
            color: #8c7643;
        }

        h1 {
            font-size: clamp(2em, 6vw, 3em);
            font-weight: normal;
            letter-spacing: 2px;
            border-bottom: 2px solid #5c4d2d;
            padding-bottom: 10px;
            margin: 8px 0 20px;
        }

        /* 故事段落 */
        .story p {
            color: #e8d9a8;
            line-height: 1.9;
            font-size: 1.08em;
            margin: 0 0 14px;
        }

        .player-name {
            color: #f5cf4f;
            font-weight: bold;
        }

        /* 玩家名字輸入 */
        .name-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin-bottom: 24px;
            font-size: 0.95em;
            color: #8c7643;
        }
        .name-bar input {
            flex: 1 1 140px;
            background: #1d1912;
            border: 1px solid #5c4d2d;
            color: #f5cf4f;
            padding: 8px 12px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 1em;
        }
        .name-bar button {
            background: #5c4d2d;
            color: #f5e6b8;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 1em;
        }
        .name-bar button:hover { background: #7a6639; }

        .clue {
            margin: 24px 0 12px;
            padding: 16px 18px;
            border-left: 3px solid #d4af37;
            background: #221e15;
            color: #e8d9a8;
            line-height: 1.8;
        }

        /* 提示訊息樣式 */
        details {
            margin-top: 15px;
            border: 1px solid #5c4d2d;
            border-radius: 8px;
            padding: 12px 16px;
        }
        summary {
            cursor: pointer;
            color: #d4af37;
        }
        .hint {
            margin: 12px 0 0;
            font-size: 1.1em;
            color: #8c7643; /* 較隱晦的金色/古銅色，適合 CTF 提示 */
            letter-spacing: 1px;
        }

        footer {
            margin-top: 28px;
            padding-top: 14px;
            border-top: 1px solid #3d3423;
            font-size: 0.9em;
            color: #8c7643;
            line-height: 1.7;
        }
    </style>
</head>
<body>
    <main>
        <div class="chapter">CHAPTER 01</div>
        <h1>遺失的禮物 🎁</h1>

        <div class="name-bar">
            <label for="nameInput">你的名字：</label>
            <input id="nameInput" type="text" maxlength="20" placeholder="不填就是小明">
            <button onclick="saveName()">確定</button>
        </div>

        <section class="story">
            <p>今天是 <span class="player-name">小明</span> 和女朋友交往一週年的約會日。</p>
            <p><span class="player-name">小明</span> 早就準備好一份神秘禮物，為了不讓女朋友提前發現，還特地把它藏在<strong>這個網站</strong>的某個角落……</p>
            <p>沒想到出門前，<span class="player-name">小明</span> 才驚覺——自己完全忘記禮物藏在哪裡了！😱</p>
            <p>距離約會只剩一個小時，請你幫 <span class="player-name">小明</span> 把禮物找回來！</p>
        </section>

        <div class="clue">
            🧠 <span class="player-name">小明</span> 努力回想：「我記得……我有跟網站上的<strong>搜尋引擎機器人</strong>說過，有個地方絕對不准任何人進去偷看……」
        </div>

        <details>
            <summary>還是想不起來？打開提示</summary>
            <p class="hint">在網址後面輸入/robots.txt試試看吧 ?</p>
        </details>

        <!-- FLAG 驗證器 -->
    <style>
      .fv-box { margin-top: 28px; padding: 18px 20px; border: 1px solid #5c4d2d; border-radius: 12px; background: #221e15; text-align: left; font-family: inherit; }
      .fv-title { color: #d4af37; font-weight: bold; margin: 0 0 12px; font-size: 1.05rem; }
      .fv-row { display: flex; flex-wrap: wrap; gap: 8px; }
      .fv-row input { flex: 1 1 180px; background: transparent; border: 1px solid #5c4d2d; color: #e8d9a8; padding: 9px 12px; border-radius: 8px; font-size: 1rem; font-family: 'Courier New', Courier, monospace; outline: none; }
      .fv-row input:focus { border-color: #d4af37; }
      .fv-row button { background: #5c4d2d; color: #f5e6b8; border: none; padding: 9px 18px; border-radius: 8px; cursor: pointer; font-size: 1rem; font-family: inherit; }
      .fv-row button:hover { filter: brightness(1.2); }
      .fv-msg { margin: 12px 0 0; min-height: 1.4em; line-height: 1.7; color: #e8d9a8; }
      .fv-msg.ok { color: #4ade80; }
      .fv-msg.bad { color: #f87171; }
    </style>
    <section class="fv-box">
      <p class="fv-title">🚩 FLAG 驗證器</p>
      <div class="fv-row">
        <input id="fvInput" type="text" placeholder="Fhcst{...}" autocomplete="off">
        <button id="fvButton" type="button">驗證</button>
      </div>
      <p id="fvMsg" class="fv-msg"></p>
    </section>

    <footer>
            找到禮物後，記得把 FLAG 拿到驗證平台登記。<br>
            下一章：<span class="player-name">小明</span> 還得趕去花店取花 💐
        </footer>
    </main>

    <script>
        // 玩家名字：存在 localStorage，沒填就預設為小明
        const NAME_KEY = 'ctf_player_name';

        function getName() {
            try {
                return (localStorage.getItem(NAME_KEY) || '').trim() || '小明';
            } catch (e) {
                return '小明';
            }
        }

        function renderName() {
            const name = getName();
            document.querySelectorAll('.player-name').forEach(el => el.textContent = name);
            document.getElementById('nameInput').value = name === '小明' ? '' : name;
        }

        function saveName() {
            const name = document.getElementById('nameInput').value.trim();
            try {
                if (name) localStorage.setItem(NAME_KEY, name);
                else localStorage.removeItem(NAME_KEY);
            } catch (e) {}
            renderName();
        }

        document.getElementById('nameInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') saveName();
        });
        renderName();
    </script>
  <script>
    // FLAG 驗證器：只比對雜湊值，原始碼裡不放明文 FLAG
    (() => {
      const CHAPTER = 0;
      const FLAG_HASH = '200186a7f9a823bb7af67626315ebe6100828d32419a9e80eaf91143babeaa30';
      const SUCCESS_MSG = '🎁 找到禮物了！{name} 鬆了一口氣，接下來趕快去花店取花吧！';
      const STATE_KEY = 'ctf_flags_unlocked_state_story';

      // 去掉 emoji 變體選擇符；只輸入 emoji 時自動補上 Fhcst{}
      function normalizeFlag(text) {
        const cleaned = text.trim().replace(/\uFE0F/g, '');
        return cleaned.startsWith('Fhcst{') ? cleaned : `Fhcst{${cleaned}}`;
      }

      async function hashHex(text) {
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
        return Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, '0')).join('');
      }

      // 與驗證平台共用進度（同網域時會同步）
      function markSolved() {
        try {
          let state = JSON.parse(localStorage.getItem(STATE_KEY) || 'null');
          if (!Array.isArray(state) || state.length !== 3) state = [false, false, false];
          state[CHAPTER] = true;
          localStorage.setItem(STATE_KEY, JSON.stringify(state));
        } catch (e) {}
      }

      async function verify() {
        const input = document.getElementById('fvInput');
        const msg = document.getElementById('fvMsg');
        if (!input.value.trim()) {
          msg.className = 'fv-msg bad';
          msg.textContent = '請先輸入 FLAG！';
          return;
        }
        if (await hashHex(normalizeFlag(input.value)) === FLAG_HASH) {
          markSolved();
          msg.className = 'fv-msg ok';
          msg.textContent = '✅ 正確！' + SUCCESS_MSG.replace('{name}', getName());
        } else {
          msg.className = 'fv-msg bad';
          msg.textContent = '❌ FLAG 錯誤，再試試看！';
        }
      }

      document.getElementById('fvButton').addEventListener('click', verify);
      document.getElementById('fvInput').addEventListener('keydown', e => {
        if (e.key === 'Enter') verify();
      });
    })();
  </script>
</body>
</html>
