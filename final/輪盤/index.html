<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>幸運大輪盤</title>
  <!-- 沒網路時會自動退回系統字型 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Huninn&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --card: #fffdf9;
      --card-soft: #fff7ec;
      --text: #5b4b44;
      --muted: #8f7f76;
      --line: #ecdfcf;
      --pink: #f2c4cb;
      --pink-deep: #d9939f;
      --blue: #c9dceb;
      --blue-deep: #86aac6;
      --yellow: #f6e3b0;
      --yellow-deep: #d4b260;
      --green: #cfe3c8;
      --green-deep: #7fae78;
      --mint: #bfe3d6;
      --mint-deep: #6fb59c;
      --navy: #252d3a;
      --navy-2: #2f3949;
      --bad: #cf7f7f;
      --display: "Baloo 2", "Huninn", "Noto Sans TC", system-ui, sans-serif;
      --body: "Huninn", "Noto Sans TC", system-ui, -apple-system, "Microsoft JhengHei", sans-serif;
      --mono: "Cascadia Code", "Consolas", "Courier New", monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--text); font-family: var(--body); overflow-x: hidden;
      background-color: #161b23;
      background-image:
        radial-gradient(ellipse at 50% 30%, rgba(111, 181, 156, .14), transparent 60%),
        linear-gradient(rgba(191, 227, 214, .05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(191, 227, 214, .05) 1px, transparent 1px);
      background-size: auto, 32px 32px, 32px 32px;
      background-attachment: fixed;
    }
    @keyframes blink { 50% { opacity: .25; } }
    @keyframes bob { 50% { transform: translateY(-6px); } }
    @keyframes pop { from { transform: scale(.85); opacity: 0; } }
    @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }

    .wrap { position: relative; z-index: 2; width: min(1040px, 100%); margin: 0 auto; padding: 28px 16px 60px; }

    /* ===== 標題 ===== */
    header.hero { text-align: center; padding: 10px 0 6px; }
    .status {
      display: inline-flex; align-items: center; gap: 8px; font-size: .85rem; font-weight: 700;
      color: var(--text); padding: 6px 16px; border-radius: 999px; background: var(--card); border: 2px solid var(--line);
    }
    .status::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--mint-deep); animation: blink 1.2s infinite; }
    .status b { font-family: var(--mono); letter-spacing: .05em; }
    .kicker { display: block; margin-top: 14px; font-family: var(--mono); font-size: .8rem; letter-spacing: .4em; color: var(--mint); }
    .title {
      display: inline-block; margin: 2px 0 6px; font-weight: 900; font-size: clamp(2.1rem, 7.5vw, 3.4rem); line-height: 1.2; letter-spacing: .06em;
      color: #f6f1ea; text-shadow: 3px 3px 0 var(--mint-deep), 0 0 24px rgba(8, 10, 14, .9);
    }
    .sub { margin: 4px 0 0; color: #d5dce4; font-size: 1.05rem; }

    /* ===== 版面 ===== */
    .layout { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; margin-top: 24px; align-items: start; }
    @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
    .panel { position: relative; background: var(--card); border: 2px solid var(--line); border-radius: 28px; box-shadow: 0 6px 0 rgba(0, 0, 0, .25); }

    /* ===== 輪盤 ===== */
    .stage { padding: 22px 18px 24px; text-align: center; }
    .wheel-box { position: relative; width: min(460px, 100%); aspect-ratio: 1; margin: 6px auto 0; }
    .wheel-box::before {
      content: ""; position: absolute; inset: -10px; border-radius: 50%;
      background: repeating-conic-gradient(var(--yellow-deep) 0 6deg, var(--card-soft) 6deg 15deg);
      -webkit-mask: radial-gradient(circle, transparent 66%, #000 67%); mask: radial-gradient(circle, transparent 66%, #000 67%);
      opacity: .55;
    }
    .wheel-box.spinning::before { animation: lights .5s steps(2) infinite; }
    @keyframes lights { to { transform: rotate(15deg); } }
    #wheel { position: relative; width: 100%; height: 100%; display: block; border-radius: 50%; box-shadow: 0 6px 0 rgba(0, 0, 0, .25), 0 0 0 6px var(--card), 0 0 0 9px var(--line); }
    .pointer {
      position: absolute; top: -18px; left: 50%; width: 44px; height: 54px; transform: translateX(-50%); z-index: 3;
      filter: drop-shadow(0 3px 0 rgba(0, 0, 0, .25));
    }
    .pointer.tick { animation: tick .12s ease-out; }
    @keyframes tick { 50% { transform: translateX(-50%) rotate(-14deg); } }
    .hub {
      position: absolute; top: 50%; left: 50%; width: 26%; aspect-ratio: 1; transform: translate(-50%, -50%); z-index: 2;
      border-radius: 50%; border: 4px solid var(--pink-deep); background: var(--pink); cursor: pointer;
      display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: clamp(1rem, 4vw, 1.5rem); color: var(--text);
      box-shadow: 0 5px 0 var(--pink-deep); transition: transform .12s, box-shadow .12s;
    }
    .hub:hover { transform: translate(-50%, -52%); }
    .hub:active { transform: translate(-50%, -46%); box-shadow: 0 1px 0 var(--pink-deep); }
    .hub:disabled { cursor: wait; filter: saturate(.6); }
    .empty-tip { position: absolute; inset: 0; display: none; place-items: center; z-index: 4; color: var(--muted); font-size: 1.1rem; }
    .empty .empty-tip { display: grid; }

    .result-line { min-height: 2.2em; margin: 22px 0 0; font-size: 1.2rem; color: var(--muted); }
    .result-line b { color: var(--text); font-size: 1.4rem; padding: 2px 14px; border-radius: 14px; background: var(--card-soft); border: 2px dashed var(--line); }

    /* ===== 按鈕 / 輸入 ===== */
    .btn {
      position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      min-height: 48px; padding: 0 22px; white-space: nowrap;
      border: 2px solid var(--pink-deep); cursor: pointer; color: var(--text); font-family: inherit; font-weight: 700;
      font-size: 1rem; border-radius: 999px; background: var(--pink);
      box-shadow: 0 4px 0 var(--pink-deep); transition: transform .12s, box-shadow .12s;
    }
    .btn::after {
      content: ""; position: absolute; top: 0; left: -60%; width: 40%; height: 100%; pointer-events: none;
      background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .65), transparent); transform: skewX(-20deg);
    }
    .btn:hover::after { animation: shine .6s ease-out; }
    @keyframes shine { to { left: 130%; } }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 5px 0 var(--pink-deep); }
    .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--pink-deep); }
    .btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }
    .btn.big { min-height: 56px; font-size: 1.2rem; min-width: 200px; margin-top: 18px; }
    .btn.blue { background: var(--blue); border-color: var(--blue-deep); box-shadow: 0 4px 0 var(--blue-deep); }
    .btn.blue:active { box-shadow: 0 1px 0 var(--blue-deep); }
    .btn.mint { background: var(--mint); border-color: var(--mint-deep); box-shadow: 0 4px 0 var(--mint-deep); }
    .btn.mint:active { box-shadow: 0 1px 0 var(--mint-deep); }
    .btn.yellow { background: var(--yellow); border-color: var(--yellow-deep); box-shadow: 0 4px 0 var(--yellow-deep); }
    .btn.yellow:active { box-shadow: 0 1px 0 var(--yellow-deep); }
    .btn.sm { min-height: 40px; padding: 0 14px; font-size: .92rem; }

    input[type="text"], textarea {
      flex: 1 1 140px; min-width: 0; background: var(--card-soft); border: 2px solid var(--line); color: var(--text);
      padding: 10px 16px; border-radius: 999px; font-size: 1rem; font-family: inherit; outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    textarea { width: 100%; border-radius: 20px; resize: vertical; min-height: 110px; line-height: 1.6; }
    input[type="text"]:focus, textarea:focus { border-color: var(--mint-deep); box-shadow: 0 0 0 4px rgba(191, 227, 214, .6); }
    input.shake { animation: shake .45s; border-color: var(--bad); }

    /* ===== 選項清單 ===== */
    .editor { padding: 20px 18px 22px; }
    .ed-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
    .tag { display: inline-block; font-family: var(--mono); font-size: .78rem; letter-spacing: .1em; color: var(--mint); border-radius: 999px; padding: 5px 14px; background: var(--navy); }
    h2 { margin: 6px 0 0; font-size: 1.4rem; font-weight: 900; text-shadow: 2px 2px 0 var(--yellow); }
    .count { font-family: var(--mono); font-size: .9rem; color: var(--muted); }
    .row { display: flex; flex-wrap: wrap; gap: 10px; }
    .list { list-style: none; margin: 16px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; max-height: 360px; overflow-y: auto; padding-right: 4px; }
    .list::-webkit-scrollbar { width: 8px; }
    .list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
    .item {
      display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 12px; border-radius: 18px;
      background: var(--card-soft); border: 2px solid var(--line); animation: pop .3s cubic-bezier(.2, 1.6, .4, 1);
    }
    .item.win { border-color: var(--green-deep); background: #f1f8ee; }
    .item .dot { flex: none; width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(91, 75, 68, .35); }
    .item .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item .del {
      flex: none; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-size: 1rem; line-height: 1;
      border: 2px solid var(--line); background: var(--card); color: var(--bad); transition: background .15s, border-color .15s, transform .15s;
    }
    .item .del:hover { background: #fdf0f1; border-color: var(--pink-deep); transform: rotate(90deg); }
    .item .del:disabled { opacity: .4; cursor: not-allowed; transform: none; }
    .list-empty { text-align: center; color: var(--muted); padding: 18px 0 6px; }

    .ed-tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-top: 18px; }
    .opt { display: flex; align-items: center; gap: 8px; margin-top: 16px; font-size: .95rem; color: var(--muted); cursor: pointer; user-select: none; }
    .opt input { width: 18px; height: 18px; accent-color: var(--mint-deep); }

    details { margin-top: 16px; border: 2px solid var(--line); border-radius: 20px; padding: 12px 16px; background: var(--card-soft); transition: border-color .2s; }
    details[open] { border-color: var(--yellow-deep); background: #fff6e3; }
    summary { cursor: pointer; font-weight: 700; list-style: none; display: flex; align-items: center; gap: 8px; }
    summary::-webkit-details-marker { display: none; }
    summary::before { content: "📋"; }
    details p { margin: 8px 0; font-size: .92rem; color: var(--muted); }
    details .row { margin-top: 10px; }

    /* ===== 結果彈窗 ===== */
    .modal { position: fixed; inset: 0; z-index: 80; display: none; place-items: center; padding: 16px; background: rgba(12, 16, 22, .72); }
    .modal.show { display: grid; animation: fadein .25s; }
    @keyframes fadein { from { opacity: 0; } }
    .modal-box {
      position: relative; width: min(420px, 100%); padding: 26px 22px 22px; text-align: center; border-radius: 28px;
      background: var(--card); border: 3px solid var(--mint-deep); box-shadow: 0 6px 0 #1a212b;
      animation: pop .5s cubic-bezier(.2, 1.6, .4, 1);
    }
    .modal-box .emoji { font-size: 3rem; display: block; animation: bob 1.6s ease-in-out infinite; }
    .modal-box .sub-k { font-family: var(--mono); font-size: .8rem; letter-spacing: .3em; color: var(--mint-deep); }
    .modal-box .winner { margin: 8px 0 18px; font-size: clamp(1.8rem, 8vw, 2.6rem); font-weight: 900; line-height: 1.3; word-break: break-word; text-shadow: 2px 2px 0 var(--yellow); }
    .modal-box .row { justify-content: center; }

    #confetti { position: fixed; inset: 0; z-index: 90; pointer-events: none; width: 100%; height: 100%; }

    footer.site { text-align: center; margin-top: 30px; color: #c6cfd9; font-size: .82rem; line-height: 1.8; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <span class="status">輪盤待命中 · 已轉 <b id="spinCount">0</b> 次</span>
      <span class="kicker">LUCKY WHEEL</span>
      <h1 class="title">幸運大輪盤</h1>
      <p class="sub">新增選項、按下 GO，讓命運幫你決定 🎯</p>
    </header>

    <div class="layout">
      <section class="panel stage">
        <div class="wheel-box" id="wheelBox">
          <svg class="pointer" id="pointer" viewBox="0 0 44 54" aria-hidden="true">
            <path d="M22 52 L4 14 A18 18 0 1 1 40 14 Z" fill="#f6e3b0" stroke="#6b5a50" stroke-width="3" stroke-linejoin="round"/>
            <circle cx="22" cy="18" r="6" fill="#fffdf9" stroke="#6b5a50" stroke-width="2.5"/>
          </svg>
          <canvas id="wheel" width="920" height="920" aria-label="輪盤"></canvas>
          <button type="button" class="hub" id="hubBtn" aria-label="轉動輪盤">GO!</button>
          <div class="empty-tip">先在右邊新增至少 2 個選項 👉</div>
        </div>
        <button type="button" class="btn big" id="spinBtn">🎡 轉動輪盤</button>
        <p class="result-line" id="resultLine">還沒轉過喔～</p>
      </section>

      <section class="panel editor">
        <div class="ed-head">
          <div>
            <span class="tag">OPTIONS</span>
            <h2>輪盤選項</h2>
          </div>
          <span class="count" id="count">0 項</span>
        </div>

        <form class="row" id="addForm" autocomplete="off">
          <input type="text" id="addInput" maxlength="30" placeholder="輸入選項，按 Enter 新增">
          <button type="submit" class="btn mint">＋ 新增</button>
        </form>

        <ul class="list" id="list"></ul>

        <label class="opt"><input type="checkbox" id="removeWinner"> 抽中後自動從輪盤移除</label>
        <label class="opt"><input type="checkbox" id="soundOn" checked> 🔊 轉動音效</label>

        <details>
          <summary>批次貼上選項</summary>
          <p>一行一個選項，會加在現有清單後面。</p>
          <textarea id="bulkInput" placeholder="珍珠奶茶&#10;雞排&#10;滷肉飯"></textarea>
          <div class="row"><button type="button" class="btn yellow sm" id="bulkBtn">📥 全部加入</button></div>
        </details>

        <div class="ed-tools">
          <button type="button" class="btn blue sm" id="shuffleBtn">🔀 打亂順序</button>
          <button type="button" class="btn yellow sm" id="resetBtn">↺ 預設選項</button>
          <button type="button" class="btn sm" id="clearBtn">🗑️ 全部清空</button>
        </div>
      </section>
    </div>

    <footer class="site">100% 純前端 — 選項只存在你自己的瀏覽器裡，不會上傳到任何地方。</footer>
  </div>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="winnerText">
    <div class="modal-box">
      <span class="emoji">🎉</span>
      <span class="sub-k">THE WHEEL SAYS</span>
      <div class="winner" id="winnerText"></div>
      <div class="row">
        <button type="button" class="btn mint" id="againBtn">🎡 再轉一次</button>
        <button type="button" class="btn blue" id="closeBtn">好的</button>
      </div>
    </div>
  </div>
  <canvas id="confetti"></canvas>

  <script>
    const COLORS = ['#f2c4cb', '#c9dceb', '#f6e3b0', '#cfe3c8', '#bfe3d6', '#e6d3ef', '#f7d2b8', '#d6e6f5'];
    const DEFAULTS = ['珍珠奶茶', '雞排', '滷肉飯', '牛肉麵', '小籠包', '臭豆腐'];
    const STORE_KEY = 'lucky-wheel-v1';
    const TAU = Math.PI * 2;

    const $ = id => document.getElementById(id);
    const canvas = $('wheel'), ctx = canvas.getContext('2d');
    const listEl = $('list'), addInput = $('addInput');

    let items = [];
    let rotation = 0;       // 目前輪盤順時針轉了幾弧度
    let spinning = false;
    let spins = 0;
    let lastWinner = -1;

    // ===== 儲存（無痕模式等情況讀不到也沒關係） =====
    function load() {
      try {
        const data = JSON.parse(localStorage.getItem(STORE_KEY));
        if (data && Array.isArray(data.items)) {
          items = data.items.filter(s => typeof s === 'string' && s.trim()).map(s => s.slice(0, 30));
          $('removeWinner').checked = !!data.removeWinner;
          $('soundOn').checked = data.soundOn !== false;
          return;
        }
      } catch (e) {}
      items = DEFAULTS.slice();
    }
    function save() {
      try {
        localStorage.setItem(STORE_KEY, JSON.stringify({ items, removeWinner: $('removeWinner').checked, soundOn: $('soundOn').checked }));
      } catch (e) {}
    }

    // ===== 畫輪盤 =====
    function colorOf(i) {
      // 奇數個選項時，最後一格避開跟第一格同色
      let c = i % COLORS.length;
      if (i === items.length - 1 && i > 0 && c === 0) c = 1;
      return COLORS[c];
    }

    function fitText(text, maxW) {
      if (ctx.measureText(text).width <= maxW) return text;
      let t = text;
      while (t.length > 1 && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1);
      return t + '…';
    }

    function draw() {
      const W = canvas.width, R = W / 2, n = items.length;
      ctx.clearRect(0, 0, W, W);
      ctx.save();
      ctx.translate(R, R);
      ctx.rotate(rotation);

      if (n === 0) {
        ctx.beginPath(); ctx.arc(0, 0, R - 4, 0, TAU);
        ctx.fillStyle = '#fff7ec'; ctx.fill();
        ctx.lineWidth = 6; ctx.strokeStyle = '#ecdfcf'; ctx.stroke();
        ctx.restore();
        return;
      }

      const seg = TAU / n;
      for (let i = 0; i < n; i++) {
        // 從正上方開始，順時針排列
        const a0 = -Math.PI / 2 + i * seg, a1 = a0 + seg;
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, R - 4, a0, a1); ctx.closePath();
        ctx.fillStyle = colorOf(i); ctx.fill();
        ctx.lineWidth = n > 1 ? 4 : 0; ctx.strokeStyle = '#fffdf9'; if (n > 1) ctx.stroke();

        ctx.save();
        ctx.rotate(a0 + seg / 2);
        const fs = Math.max(22, Math.min(52, 340 / Math.max(n, 6) * 1.1));
        ctx.font = `700 ${fs}px Huninn, "Noto Sans TC", "Microsoft JhengHei", sans-serif`;
        ctx.fillStyle = '#5b4b44';
        ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        ctx.fillText(fitText(items[i], R * 0.62), R - 34, 0);
        ctx.restore();
      }

      ctx.beginPath(); ctx.arc(0, 0, R - 4, 0, TAU);
      ctx.lineWidth = 8; ctx.strokeStyle = '#6b5a50'; ctx.stroke();
      ctx.restore();
    }

    // ===== 選項清單 =====
    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function render() {
      $('count').textContent = `${items.length} 項`;
      $('wheelBox').classList.toggle('empty', items.length < 2);
      const canSpin = items.length >= 2 && !spinning;
      $('spinBtn').disabled = !canSpin;
      $('hubBtn').disabled = !canSpin;

      if (!items.length) {
        listEl.innerHTML = '<li class="list-empty">目前沒有任何選項，快新增一個吧 ✍️</li>';
      } else {
        listEl.innerHTML = items.map((s, i) => `
          <li class="item${i === lastWinner ? ' win' : ''}">
            <span class="dot" style="background:${colorOf(i)}"></span>
            <span class="label" title="${escapeHtml(s)}">${escapeHtml(s)}</span>
            <button type="button" class="del" data-i="${i}" aria-label="刪除 ${escapeHtml(s)}" ${spinning ? 'disabled' : ''}>✕</button>
          </li>`).join('');
      }
      draw();
      save();
    }

    function addItem(text) {
      text = text.trim().slice(0, 30);
      if (!text) return false;
      items.push(text);
      lastWinner = -1;
      return true;
    }

    $('addForm').addEventListener('submit', e => {
      e.preventDefault();
      if (spinning) return;
      if (!addItem(addInput.value)) {
        addInput.classList.remove('shake'); void addInput.offsetWidth; addInput.classList.add('shake');
        return;
      }
      addInput.value = '';
      render();
      listEl.scrollTop = listEl.scrollHeight;
    });
    addInput.addEventListener('animationend', () => addInput.classList.remove('shake'));

    listEl.addEventListener('click', e => {
      const btn = e.target.closest('.del');
      if (!btn || spinning) return;
      items.splice(+btn.dataset.i, 1);
      lastWinner = -1;
      render();
    });

    $('bulkBtn').addEventListener('click', () => {
      if (spinning) return;
      const lines = $('bulkInput').value.split(/\r?\n/);
      let added = 0;
      lines.forEach(l => { if (addItem(l)) added++; });
      if (added) { $('bulkInput').value = ''; render(); }
    });

    $('shuffleBtn').addEventListener('click', () => {
      if (spinning) return;
      for (let i = items.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [items[i], items[j]] = [items[j], items[i]];
      }
      lastWinner = -1;
      render();
    });
    $('resetBtn').addEventListener('click', () => {
      if (spinning) return;
      items = DEFAULTS.slice(); lastWinner = -1; render();
    });
    $('clearBtn').addEventListener('click', () => {
      if (spinning || !items.length) return;
      if (!confirm('確定要清空全部選項嗎？')) return;
      items = []; lastWinner = -1; render();
    });
    $('removeWinner').addEventListener('change', save);
    $('soundOn').addEventListener('change', save);

    // ===== 音效 =====
    let audio;
    function beep(freq, dur, vol = .08, type = 'triangle') {
      if (!$('soundOn').checked) return;
      try {
        audio = audio || new (window.AudioContext || window.webkitAudioContext)();
        const o = audio.createOscillator(), g = audio.createGain();
        o.type = type; o.frequency.value = freq;
        g.gain.setValueAtTime(vol, audio.currentTime);
        g.gain.exponentialRampToValueAtTime(.0001, audio.currentTime + dur);
        o.connect(g).connect(audio.destination);
        o.start(); o.stop(audio.currentTime + dur);
      } catch (e) {}
    }
    function fanfare() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, .25, .1), i * 110)); }

    // ===== 轉動 =====
    const pointer = $('pointer');
    const indexAt = r => {
      const n = items.length, seg = TAU / n;
      const a = ((-r) % TAU + TAU) % TAU;   // 指針（正上方）對到的輪盤角度
      return Math.min(n - 1, Math.floor(a / seg));
    };

    function spin() {
      if (spinning || items.length < 2) return;
      spinning = true;
      lastWinner = -1;
      render();
      $('wheelBox').classList.add('spinning');
      $('resultLine').textContent = '轉呀轉～ 🌀';

      const n = items.length, seg = TAU / n;
      const target = Math.floor(Math.random() * n);
      const offset = (0.15 + Math.random() * 0.7) * seg;      // 不要停在格線上
      const base = rotation - (rotation % TAU);
      const turns = 5 + Math.floor(Math.random() * 3);
      const end = base + turns * TAU + (TAU - (target * seg + offset));
      const start = rotation, dist = end - start;
      const duration = 4200 + Math.random() * 1200;
      const t0 = performance.now();
      let lastIdx = indexAt(start);

      function frame(now) {
        const t = Math.min(1, (now - t0) / duration);
        const ease = 1 - Math.pow(1 - t, 4);
        rotation = start + dist * ease;
        draw();
        const idx = indexAt(rotation);
        if (idx !== lastIdx) {
          lastIdx = idx;
          beep(900, .04, .05, 'square');
          pointer.classList.remove('tick'); void pointer.offsetWidth; pointer.classList.add('tick');
        }
        if (t < 1) requestAnimationFrame(frame);
        else finish(target);
      }
      requestAnimationFrame(frame);
    }

    function finish(idx) {
      rotation %= TAU;
      spinning = false;
      spins++;
      $('spinCount').textContent = spins;
      $('wheelBox').classList.remove('spinning');
      const winner = items[idx];
      $('resultLine').innerHTML = `上次抽中：<b>${escapeHtml(winner)}</b>`;
      $('winnerText').textContent = winner;

      if ($('removeWinner').checked) {
        items.splice(idx, 1);
        lastWinner = -1;
      } else {
        lastWinner = idx;
      }
      render();
      fanfare();
      confetti();
      $('modal').classList.add('show');
      $('againBtn').disabled = items.length < 2;
      $('closeBtn').focus();
    }

    $('spinBtn').addEventListener('click', spin);
    $('hubBtn').addEventListener('click', spin);
    function closeModal() { $('modal').classList.remove('show'); }
    $('closeBtn').addEventListener('click', closeModal);
    $('againBtn').addEventListener('click', () => { closeModal(); spin(); });
    $('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal();
    });

    // ===== 彩帶 =====
    const cf = $('confetti'), cctx = cf.getContext('2d');
    let pieces = [], cfRunning = false;
    function confetti() {
      cf.width = innerWidth; cf.height = innerHeight;
      for (let i = 0; i < 140; i++) {
        pieces.push({
          x: cf.width / 2 + (Math.random() - .5) * 80, y: cf.height * .45,
          vx: (Math.random() - .5) * 16, vy: -Math.random() * 15 - 5,
          w: 6 + Math.random() * 8, h: 4 + Math.random() * 6, r: Math.random() * TAU, vr: (Math.random() - .5) * .3,
          c: COLORS[i % COLORS.length], life: 0
        });
      }
      if (!cfRunning) { cfRunning = true; requestAnimationFrame(cfFrame); }
    }
    function cfFrame() {
      cctx.clearRect(0, 0, cf.width, cf.height);
      pieces = pieces.filter(p => p.y < cf.height + 20 && p.life < 260);
      pieces.forEach(p => {
        p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
        cctx.save(); cctx.translate(p.x, p.y); cctx.rotate(p.r);
        cctx.fillStyle = p.c; cctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        cctx.restore();
      });
      if (pieces.length) requestAnimationFrame(cfFrame);
      else { cfRunning = false; cctx.clearRect(0, 0, cf.width, cf.height); }
    }

    // ===== 啟動 =====
    load();
    render();
    // 字型載入後重畫一次，讓輪盤上的字用 Huninn
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
  </script>
</body>
</html>
