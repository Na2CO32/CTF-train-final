<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>伺服器搶劫案 - 秘密金庫彩蛋</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font: Fredoka for playful titles & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #0f141c;
            color: #e2e8f0;
            overflow-x: hidden;
        }

        /* Perspective Grid Pattern matched to image background */
        .bg-grid {
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .perspective-grid {
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background-image: 
                linear-gradient(rgba(100, 116, 139, 0.12) 1px, transparent 1px),
                linear-gradient(90deg, rgba(100, 116, 139, 0.12) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: perspective(500px) rotateX(60deg);
            z-index: 0;
            pointer-events: none;
        }

        /* Star Float Animation */
        @keyframes floatStar {
            0%, 100% { transform: translateY(0px) scale(1); opacity: 0.3; }
            50% { transform: translateY(-10px) scale(1.2); opacity: 0.8; }
        }
        .star { animation: floatStar 4s ease-in-out infinite; }
        .star-delay-1 { animation-delay: 1s; }
        .star-delay-2 { animation-delay: 2s; }
        .star-delay-3 { animation-delay: 3s; }

        /* Server LED Blink */
        @keyframes blink {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        .led-blink-1 { animation: blink 1.2s infinite; }
        .led-blink-2 { animation: blink 0.8s infinite 0.3s; }
        .led-blink-3 { animation: blink 1.5s infinite 0.6s; }

        /* Gentle Rotation for Vault Dial */
        @keyframes subtleRotate {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(15deg); }
            100% { transform: rotate(0deg); }
        }
        .vault-wheel {
            transform-origin: center;
            animation: subtleRotate 12s ease-in-out infinite;
        }

        /* Text outline like the original image title */
        .title-shadow {
            text-shadow: 
                3px 3px 0px #1a202c,
                -1px -1px 0px #1a202c,
                1px -1px 0px #1a202c,
                -1px 1px 0px #1a202c,
                1px 1px 0px #1a202c;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between relative bg-[#0d121a] text-slate-200 py-8 px-4 select-none">

    <!-- Perspective Grid Background -->
    <div class="perspective-grid"></div>

    <!-- Floating Background Stars / Dust Particles -->
    <div class="absolute inset-0 pointer-events-none z-0 overflow-hidden">
        <div class="star absolute top-12 left-10 text-amber-200 text-xs">✦</div>
        <div class="star star-delay-1 absolute top-1/4 left-1/5 text-teal-300 text-sm">★</div>
        <div class="star star-delay-2 absolute top-1/3 right-12 text-pink-300 text-xs">✦</div>
        <div class="star star-delay-3 absolute bottom-20 left-16 text-sky-300 text-sm">✦</div>
        <div class="star star-delay-1 absolute bottom-1/3 right-1/4 text-amber-100 text-xs">★</div>
        <div class="star star-delay-2 absolute top-20 right-1/3 text-emerald-200 text-xs">✦</div>
    </div>

    <!-- Main Container -->
    <div class="relative z-10 w-full max-w-4xl flex flex-col items-center">

        <!-- Top Pill Badge (Style matched to image: 白底帶微小圓點與文字) -->
        <div class="inline-flex items-center gap-2 bg-white/95 text-slate-800 text-xs sm:text-sm font-bold px-5 py-1.5 rounded-full shadow-md border-2 border-slate-700/20 mb-6">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 inline-block animate-pulse"></span>
            <span>EASTER EGG · 金庫核心伺服器室</span>
            <span class="bg-amber-100 text-amber-800 px-2 py-0.5 rounded-md text-[11px] font-extrabold ml-1">通關秘寶</span>
        </div>

        <!-- Main Heading Title -->
        <h1 class="text-3xl sm:text-5xl font-black tracking-wider text-center text-white title-shadow mb-3 font-['Fredoka']">
            男爵的秘密金庫

        <!-- Subtitle Container Card -->
        <p class="text-center text-xs sm:text-sm text-slate-300 bg-slate-900/60 backdrop-blur-md px-6 py-2 rounded-full border border-slate-700/50 mb-8 max-w-2xl">
            恭喜發現隱藏彩蛋！這裡是儲存機密檔案的主伺服器與三層加密金庫。
        </p>

        <!-- Dynamic Illustration: Server Racks + Vault Door -->

                <!-- Floor Shadow -->

                <!-- ================= LEFT SERVER RACK ================= -->

                    <!-- Rack Frame -->
                    <rect x="90" y="80" width="130" height="340" rx="16" fill="#1e293b" stroke="#334155" stroke-width="6"/>
                    <rect x="102" y="92" width="106" height="316" rx="8" fill="#0f172a"/>
                    
                    <!-- Server Unit 1 -->
                    <rect x="110" y="105" width="90" height="42" rx="6" fill="#1e293b" stroke="#475569" stroke-width="2"/>
                    <circle cx="125" cy="126" r="4" fill="#38bdf8" class="led-blink-1"/>
                    <circle cx="137" cy="126" r="4" fill="#4ade80" class="led-blink-2"/>
                    <line x1="155" y1="121" x2="190" y2="121" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
                    <line x1="155" y1="131" x2="180" y2="131" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>

                    <!-- Server Unit 2 (Gold Accent) -->
                    <rect x="110" y="155" width="90" height="55" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
                    <rect x="118" y="165" width="30" height="35" rx="4" fill="#0f172a"/>
                    <circle cx="133" cy="182.5" r="8" fill="#fbbf24" class="led-blink-3"/>
                    <line x1="158" y1="170" x2="190" y2="170" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
                    <line x1="158" y1="182" x2="185" y2="182" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
                    <line x1="158" y1="194" x2="190" y2="194" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>

                    <rect x="118" y="276" width="74" height="12" rx="3" fill="#0f172a"/>
                    <rect x="118" y="292" width="74" height="12" rx="3" fill="#0f172a"/>
                    <rect x="118" y="308" width="74" height="12" rx="3" fill="#0f172a"/>
                    <circle cx="184" cy="282" r="2" fill="#38bdf8" class="led-blink-3"/>
                    <circle cx="184" cy="298" r="2" fill="#38bdf8" class="led-blink-1"/>
                    <circle cx="184" cy="314" r="2" fill="#4ade80" class="led-blink-2"/>

                    <!-- Server Unit 5 (Bottom ventilation) -->
                    <rect x="110" y="351" width="90" height="45" rx="6" fill="#1e293b" stroke="#475569" stroke-width="2"/>
                    <line x1="120" y1="365" x2="180" y2="365" stroke="#475569" stroke-width="2" stroke-dasharray="4 3"/>
                    <line x1="120" y1="373" x2="180" y2="373" stroke="#475569" stroke-width="2" stroke-dasharray="4 3"/>
                    <line x1="120" y1="381" x2="180" y2="381" stroke="#475569" stroke-width="2" stroke-dasharray="4 3"/>
                </g>

                <!-- ================= RIGHT SERVER RACK ================= -->
                <g id="Right-Server">
                    <!-- Rack Frame -->
                    <rect x="580" y="80" width="130" height="340" rx="16" fill="#1e293b" stroke="#334155" stroke-width="6"/>
                    <rect x="592" y="92" width="106" height="316" rx="8" fill="#0f172a"/>

                    <!-- Server Unit 1 (Cyan Theme) -->
                    <rect x="600" y="105" width="90" height="60" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
                    <circle cx="615" cy="125" r="5" fill="#22d3ee" class="led-blink-2"/>
                    <circle cx="630" cy="125" r="5" fill="#a7f3d0" class="led-blink-1"/>
                    <rect x="612" y="142" width="66" height="12" rx="3" fill="#0f172a"/>

                    <!-- Server Unit 2 -->
                    <rect x="600" y="173" width="90" height="42" rx="6" fill="#1e293b" stroke="#475569" stroke-width="2"/>
                    <circle cx="615" cy="194" r="4" fill="#4ade80" class="led-blink-3"/>
                    <line x1="635" y1="194" x2="680" y2="194" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>

                    <!-- Server Unit 3 -->

                    <rect x="610" y="233" width="70" height="16" rx="3" fill="#0f172a"/>
                    <rect x="610" y="255" width="70" height="16" rx="3" fill="#0f172a"/>
                    <rect x="610" y="277" width="70" height="16" rx="3" fill="#0f172a"/>
                    <circle cx="673" cy="241" r="2.5" fill="#fbbf24" class="led-blink-1"/>
                    <circle cx="673" cy="263" r="2.5" fill="#22d3ee" class="led-blink-2"/>
                    <circle cx="673" cy="285" r="2.5" fill="#4ade80" class="led-blink-3"/>

                    <!-- Server Unit 4 -->
                    <rect x="600" y="316" width="90" height="80" rx="6" fill="#1e293b" stroke="#ec4899" stroke-width="2"/>
                    <circle cx="620" cy="336" r="6" fill="#f472b6" class="led-blink-1"/>
                    <line x1="635" y1="336" x2="680" y2="336" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
                    <line x1="612" y1="355" x2="678" y2="355" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
                    <line x1="612" y1="367" x2="678" y2="367" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
                    <line x1="612" y1="379" x2="650" y2="379" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
                </g>

                <!-- Connecting Cables (Stylized Pastel Cables) -->
                <path d="M 220 130 C 260 130, 250 380, 290 380" stroke="#38bdf8" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7"/>
                <path d="M 220 180 C 270 180, 260 400, 300 400" stroke="#fbbf24" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7"/>
                <path d="M 580 130 C 540 130, 550 380, 510 380" stroke="#22d3ee" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7"/>
                <path d="M 580 340 C 530 340, 540 400, 500 400" stroke="#f472b6" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7"/>

                <!-- ================= CENTER VAULT DOOR ================= -->
                <g id="Vault-Door">
                    <!-- Outer Vault Arch Structure -->
                    <rect x="250" y="60" width="300" height="360" rx="30" fill="#1e293b" stroke="#334155" stroke-width="8"/>
                    <rect x="265" y="75" width="270" height="330" rx="20" fill="#0f172a"/>

                    <!-- Vault Outer Metallic Ring -->
                    <circle cx="400" cy="240" r="135" fill="#334155" stroke="#475569" stroke-width="6"/>
                    <circle cx="400" cy="240" r="120" fill="#1e293b"/>

                    <!-- Decorative Vault Bolts / Pins -->
                    <circle cx="400" cy="128" r="7" fill="#94a3b8"/>
                    <circle cx="400" cy="352" r="7" fill="#94a3b8"/>
                    <circle cx="288" cy="240" r="7" fill="#94a3b8"/>
                    <circle cx="512" cy="240" r="7" fill="#94a3b8"/>
                    <circle cx="321" cy="161" r="7" fill="#94a3b8"/>
                    <circle cx="479" cy="319" r="7" fill="#94a3b8"/>
                    <circle cx="321" cy="319" r="7" fill="#94a3b8"/>
                    <circle cx="479" cy="161" r="7" fill="#94a3b8"/>

                    <!-- Inner Door Main Plate (Cute Pastel Mint / Gold Accent) -->
                    <circle cx="400" cy="240" r="100" fill="#0284c7" stroke="#38bdf8" stroke-width="6"/>
                    <circle cx="400" cy="240" r="88" fill="#0f172a"/>

                    <!-- Golden Keyhole Inner Dial -->
                    <circle cx="400" cy="240" r="60" fill="#f59e0b" stroke="#fbbf24" stroke-width="5"/>
                    <circle cx="400" cy="240" r="48" fill="#d97706"/>

                    <!-- Central Wheel Handle (Animated Gentle Rotation) -->
                    <g class="vault-wheel">
                        <circle cx="400" cy="240" r="22" fill="#fef08a" stroke="#f59e0b" stroke-width="4"/>
                        <!-- Wheel Spokes -->
                        <rect x="394" y="180" width="12" height="120" rx="6" fill="#fef08a"/>
                        <rect x="340" y="234" width="120" height="12" rx="6" fill="#fef08a"/>
                        <circle cx="400" cy="240" r="10" fill="#b45309"/>
                        
                        <!-- Spoke Handles -->
                        <circle cx="400" cy="180" r="8" fill="#fbbf24"/>
                        <circle cx="400" cy="300" r="8" fill="#fbbf24"/>
                        <circle cx="340" cy="240" r="8" fill="#fbbf24"/>
                        <circle cx="460" cy="240" r="8" fill="#fbbf24"/>
                    </g>

                    <!-- Electronic Keypad / Status Display above door -->
                    <rect x="340" y="95" width="120" height="30" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
                    <rect x="348" y="102" width="104" height="16" rx="4" fill="#0284c7"/>
                    <text x="400" y="114" fill="#e0f2fe" font-size="10" font-weight="900" text-anchor="middle" font-family="sans-serif" letter-spacing="2">LOCKED · 99%</text>

                    <!-- Status LEDs under keypad -->
                    <circle cx="320" cy="110" r="4" fill="#ef4444" class="led-blink-1"/>
                    <circle cx="480" cy="110" r="4" fill="#22c55e"/>
                </g>
                
            </svg>
        </div>

        <!-- Cute Action / Information Pill Cards (Matched to bottom cards in screenshot) -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 w-full mt-2">
            
            <!-- Card 1 -->
            <div class="bg-white text-slate-800 rounded-2xl p-4 flex items-center gap-3 shadow-lg border-2 border-slate-200">
                <div class="w-10 h-10 rounded-xl bg-teal-100 text-teal-600 flex items-center justify-center text-xl shrink-0">
                    <i class="fa-solid fa-vault"></i>
                </div>
                <div>
                    <div class="text-[10px] font-bold tracking-wider text-teal-600 uppercase">VAULT STATUS</div>
                    <div class="text-xs font-black text-slate-800">男爵金庫：高度安全</div>
                </div>
            </div>

            <!-- Card 2 -->
            <div class="bg-white text-slate-800 rounded-2xl p-4 flex items-center gap-3 shadow-lg border-2 border-slate-200">
                <div class="w-10 h-10 rounded-xl bg-amber-100 text-amber-600 flex items-center justify-center text-xl shrink-0">
                    <i class="fa-solid fa-server"></i>
                </div>
                <div>
                    <div class="text-[10px] font-bold tracking-wider text-amber-600 uppercase">SERVER CORE</div>
                    <div class="text-xs font-black text-slate-800">主伺服器：正常運轉</div>
                </div>
            </div>

            <!-- Card 3 -->
            <div class="bg-white text-slate-800 rounded-2xl p-4 flex items-center gap-3 shadow-lg border-2 border-slate-200">
                <div class="w-10 h-10 rounded-xl bg-pink-100 text-pink-500 flex items-center justify-center text-xl shrink-0">
                    <i class="fa-solid fa-key"></i>
                </div>
                <div>
                    <div class="text-[10px] font-bold tracking-wider text-pink-500 uppercase">SECRET CODE</div>
                    <div class="text-xs font-black text-slate-800">彩蛋密碼：HEIST2026</div>
                </div>
            </div>

        </div>

    </div>

    <!-- Footer Notice -->
    <footer class="relative z-10 text-center text-xs text-slate-500 mt-8">
        伺服器搶劫案 THE SERVER HEIST · 隱藏彩蛋展示頁面
    </footer>

</body>
